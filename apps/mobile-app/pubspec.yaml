name: spendlog
description: SpendLog — auto-imports transactions from SMS and Gmail.
publish_to: "none"
version: 0.6.12+61

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  another_telephony: ^0.4.1
  intl: ^0.19.0
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  workmanager: ^0.10.10
  # Saving a statement PDF somewhere the system viewer can open it.
  # A file:// URI is not enough on modern Android; open_filex does the
  # FileProvider plumbing that makes one openable.
  # Taking or choosing a picture of a coupon. Its maxWidth/maxHeight do
  # the shrinking for us: a vision model tiles an image and the count
  # grows with the area, so a full phone photo costs minutes on CPU where
  # a 1024px one costs seconds.
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  flutter_contacts: ^2.5.0
  # The design's own icon set (docs/design-assets/icons), drawn from its
  # path data in lib/widgets/ds/ds_glyphs.g.dart.
  flutter_svg: ^2.2.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_appauth: ^12.1.0
  # Every credential lives here, never in SharedPreferences: it is
  # encrypted with an Android Keystore key that is never backed up and dies
  # with the app, so a restored backup cannot bring a session back.
  # See lib/services/credential_store.dart and res/xml/backup_rules.xml.
  flutter_secure_storage: ^11.2.0
  # When this install happened, which is how data a backup restored is told
  # apart from data this same install wrote (lib/services/install_info.dart).
  package_info_plus: ^10.2.2
  # Reads whether Android grants SMS access right now, without prompting.
  # A remembered "granted" flag can be restored onto a phone that never
  # granted anything. Held at 12: 13 brings permission_handler_android 14,
  # which compiles against SDK 37, and this AGP cannot find that platform.
  permission_handler: ^12.0.1
  app_links: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/logo_full.png

  # IBM Plex, bundled so the app looks right offline (SIL OFL 1.1; the
  # licence is in assets/fonts/OFL.txt). Static TTFs from IBM/plex.
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

# Generates the native Android/iOS launcher icons from the brand asset.
# Run after `flutter create .`:  dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#2f3540"
  adaptive_icon_foreground: "assets/app_icon.png"
