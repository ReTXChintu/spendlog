name: spendlog
description: SpendLog — auto-imports transactions from SMS and Gmail.
publish_to: "none"
version: 0.2.5+25

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  google_sign_in: ^6.2.1
  another_telephony: ^0.4.1
  intl: ^0.19.0
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  workmanager: ^0.10.10
  # Saving a statement PDF somewhere the system viewer can open it.
  # A file:// URI is not enough on modern Android; open_filex does the
  # FileProvider plumbing that makes one openable.
  # Taking or choosing a picture of a coupon. Its maxWidth/maxHeight do
  # the shrinking for us: a vision model tiles an image and the count
  # grows with the area, so a full phone photo costs minutes on CPU where
  # a 1024px one costs seconds.
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/logo_full.png

# Generates the native Android/iOS launcher icons from the brand asset.
# Run after `flutter create .`:  dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#2f3540"
  adaptive_icon_foreground: "assets/app_icon.png"
