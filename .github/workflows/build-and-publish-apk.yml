name: Build APK and publish to VPS

# Builds the Android APK and drops it into the deployed frontend so the web
# app can offer it for download at /SpendLog.apk.
on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  APP_DIR: /opt/var/spendlog
  ARTIFACT_NAME: SpendLog.apk

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # AGP requires JDK 17; the runner's default is not guaranteed to be it.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dart dependencies
        working-directory: apps/mobile-app
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile-app
        run: flutter analyze

      - name: Test
        working-directory: apps/mobile-app
        run: flutter test

      # Release builds are signed with the debug key (see
      # android/app/build.gradle.kts) — fine for sideloading, not for Play.
      - name: Build release APK
        working-directory: apps/mobile-app
        run: |
          flutter build apk --release \
            --dart-define=API_URL="${{ secrets.MOBILE_API_URL }}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpendLog-apk
          path: apps/mobile-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish APK to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH="ssh -i ~/.ssh/deploy_key -p $PORT $VPS_USER@$VPS_HOST"
          APK=apps/mobile-app/build/app/outputs/flutter-apk/app-release.apk

          # Upload beside the target first, then move into place, so a
          # partial transfer can never be served as a broken download.
          $SSH "mkdir -p $APP_DIR/apps/frontend/public"
          scp -i ~/.ssh/deploy_key -P "$PORT" "$APK" \
            "$VPS_USER@$VPS_HOST:$APP_DIR/apps/frontend/public/$ARTIFACT_NAME.tmp"

          # public/ is the source of truth and survives a rebuild. dist/ is
          # what the built site serves, so copy there too when it exists —
          # that makes the new APK live without waiting for a frontend build.
          $SSH "set -e
            cd $APP_DIR
            mv apps/frontend/public/$ARTIFACT_NAME.tmp apps/frontend/public/$ARTIFACT_NAME
            if [ -d apps/frontend/dist ]; then
              cp apps/frontend/public/$ARTIFACT_NAME apps/frontend/dist/$ARTIFACT_NAME
            fi
            ls -lh apps/frontend/public/$ARTIFACT_NAME"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
